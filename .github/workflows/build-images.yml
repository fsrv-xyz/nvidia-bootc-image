name: build-images

# GitHub mirror of the GitLab build: publish the base and the per-system images to
# GitHub Container Registry (ghcr.io), independently of the private ref.ci registry.
# The base is built first; the system images build FROM the ghcr base (not ref.ci).

on:
  push:
    branches: ["**"]
    tags: ["**"]

permissions:
  contents: read
  packages: write

env:
  # ghcr.io/fsrv-xyz/nvidia-bootc-image (owner is already lowercase, as ghcr requires)
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # Detect which build inputs changed in this push so downstream jobs can skip.
  # New branch / tag / unresolvable range -> treat everything as changed, so the
  # per-ref base tag is always built before the system images FROM it.
  changes:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      base_changed: ${{ steps.detect.outputs.base_changed }}
      iso_config_changed: ${{ steps.detect.outputs.iso_config_changed }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - id: meta
        # Ref name as the image tag; sanitize '/' from branch names.
        run: echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - id: detect
        run: |
          set -eu
          before='${{ github.event.before }}'
          if [ -z "$before" ] \
             || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            base_changed=true; iso_config_changed=true
          else
            files="$(git diff --name-only "$before" "$GITHUB_SHA")"
            base_re='^(Containerfile|files/|sshkeys/|\.dockerignore$|bib/config\.toml$)'
            iso_re='^bib/iso-config\.toml$'
            base_changed=false; iso_config_changed=false
            echo "$files" | grep -qE "$base_re" && base_changed=true
            echo "$files" | grep -qE "$iso_re" && iso_config_changed=true
          fi
          echo "base_changed=$base_changed" >> "$GITHUB_OUTPUT"
          echo "iso_config_changed=$iso_config_changed" >> "$GITHUB_OUTPUT"

  base:
    needs: changes
    if: ${{ needs.changes.outputs.base_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: true
          # Plain single-arch image manifest (no provenance/SBOM index) for bootc.
          provenance: false
          tags: ${{ env.IMAGE_BASE }}/base:${{ needs.changes.outputs.tag }}

  systems:
    needs: [changes, base]
    # Always build the system images; run even when `base` was skipped (base:<ref>
    # already exists from a prior pipeline), but not if `base` actually failed.
    if: ${{ !cancelled() && needs.base.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        system: [rtx3080ti, rtx4000ada]
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.19.2
        with:
          context: systems/${{ matrix.system }}
          file: systems/${{ matrix.system }}/Containerfile
          platforms: linux/amd64
          push: true
          provenance: false
          # Build FROM the ghcr base built in the `base` job — independent of ref.ci.
          build-args: |
            BASE=${{ env.IMAGE_BASE }}/base:${{ needs.changes.outputs.tag }}
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.system }}:${{ needs.changes.outputs.tag }}

  # Anaconda installer ISO for the BASE image, referencing the ghcr base (independent of
  # ref.ci). bootc-image-builder --type anaconda-iso builds an unattended installer;
  # the user bootc-switches to a system image after install. Published as a workflow
  # artifact (on every build, tags included). It is NOT attached to GitHub Releases:
  # release assets are capped at 2 GiB and this ISO is ~3 GB, so the attach step always
  # fails validation ("size must be less than 2147483648"). The artifact carries it.
  iso:
    needs: [changes, base]
    if: ${{ !cancelled() && (needs.base.result == 'success' || needs.changes.outputs.iso_config_changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
      - name: Build anaconda ISO
        run: |
          set -eux
          IMG="${IMAGE_BASE}/base:${{ needs.changes.outputs.tag }}"
          mkdir -p out
          # Auth file so bootc-image-builder can pull the (possibly private) ghcr base.
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' \
            "$(printf '%s' '${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}' | base64 -w0)" > auth.json
          # Pull the base into the host containers-storage.
          docker run --rm --privileged --network host \
            -e REGISTRY_AUTH_FILE=/auth.json -v "$PWD/auth.json:/auth.json:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/podman/stable podman pull "$IMG"
          # Build the ISO referencing the ghcr base.
          docker run --rm --privileged --network host --security-opt label=disable \
            -v "$PWD/out:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/bib/iso-config.toml:/config.toml:ro" \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso --rootfs ext4 --config /config.toml "$IMG"
          sudo chmod -R a+rX out
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: nvidia-bootc-base-installer-${{ needs.changes.outputs.tag }}
          path: out/bootiso/install.iso
          if-no-files-found: error
