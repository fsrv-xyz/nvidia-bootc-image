# Root login via SSH key only. A local root password is set for console/serial login
# only (see Containerfile) — SSH password login must stay disabled:
#   - prohibit-password: root may log in via SSH by key, never by password
#   - PasswordAuthentication no: no password login over SSH for any account
PermitRootLogin prohibit-password
PasswordAuthentication no
AuthorizedKeysFile /usr/share/sshkeys/%u.keys
