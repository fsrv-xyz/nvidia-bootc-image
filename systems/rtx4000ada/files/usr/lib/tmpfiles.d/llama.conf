# Persistent llama.cpp state on /var (only /var survives bootc upgrades). The GGUF model
# + mmproj are downloaded here from Hugging Face on first start (LLAMA_CACHE=/cache in
# llama.container is bind-mounted to /var/lib/llama/cache) and reused afterwards.
d /var/lib/llama 0755 root root -
d /var/lib/llama/cache 0755 root root -
